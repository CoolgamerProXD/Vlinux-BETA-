[package]
name = "vlinux"
version = "0.7.0"
description = "VLINUX — a Linux desktop experience for Windows, powered by WSL2"
authors = ["VLINUX contributors"]
edition = "2021"
rust-version = "1.77"
publish = false

[workspace]
members = ["crates/runtime"]

[lib]
name = "vlinux_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
os_info = { version = "3", default-features = false }
vlinux-runtime = { path = "crates/runtime" }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
