[package]
name = "vlinux-runtime"
version = "0.1.0"
description = "VLINUX Linux-runtime layer: WSL detection, distro adapters, install workflow, storage model. No UI / Tauri dependency."
edition = "2021"
rust-version = "1.77"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
dirs = "7"
serde_json = "1"
portable-pty = "0.9"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem"] }
