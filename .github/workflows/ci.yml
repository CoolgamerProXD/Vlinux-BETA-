name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runtime:
    name: Runtime crate tests (fast, no Tauri, no Windows)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Test vlinux-runtime (fake wsl.exe output, no distribution needed)
        working-directory: src-tauri
        shell: bash
        run: |
          set +e
          cargo test -p vlinux-runtime --locked 2>&1 | tee ../runtime-test.log
          code=${PIPESTATUS[0]}
          sum=$(grep -E '^test result|^error|^warning: unused|Running |Doc-tests' ../runtime-test.log | head -40 | sed ':a;N;$!ba;s/\n/%0A/g')
          if [ "$code" -ne 0 ]; then
            det=$(grep -E -A7 '^error|^---- |panicked at|FAILED|failed:' ../runtime-test.log | head -80 | cut -c1-300 | sed ':a;N;$!ba;s/\n/%0A/g')
            echo "::error title=runtime tests FAILED::${sum}%0A${det}"
            exit 1
          fi
          echo "::notice title=runtime tests::${sum}"

      - name: Clippy on the runtime crate (informational)
        working-directory: src-tauri
        shell: bash
        run: |
          cargo clippy -p vlinux-runtime --all-targets 2>&1 | tee ../clippy.log || true
          n=$(grep -c '^warning' ../clippy.log || true)
          det=$( (grep -E -A4 '^warning|^error' ../clippy.log || true) | head -60 | cut -c1-240 | sed ':a;N;$!ba;s/\n/%0A/g')
          echo "::notice title=clippy (runtime crate): ${n} warning lines::${det}"
        continue-on-error: true

  windows:
    name: Build, test and smoke-launch on Windows
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Host information (read-only)
        shell: pwsh
        run: |
          $os = (Get-CimInstance Win32_OperatingSystem)
          $wsl = (wsl.exe --status 2>&1 | Out-String) -replace "`0",""
          $msg = "OS: $($os.Caption) $($os.Version) build $($os.BuildNumber)`nrustc: $(rustc --version)`ncargo: $(cargo --version)`nnode: $(node --version)  npm: $(npm --version)`nwsl --status: $($wsl.Trim())"
          Write-Host $msg
          Write-Host ("::notice title=Host info::" + ($msg -replace "`r","" -replace "`n","%0A"))
        continue-on-error: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build

      - name: Rust unit tests
        working-directory: src-tauri
        shell: pwsh
        run: |
          $out = cargo test --workspace --locked 2>&1 | Out-String
          Write-Host $out
          $sum = ($out -split "`n" | Where-Object { $_ -match 'Running |test result|^error|FAILED|panicked' }) -join "`n"
          Write-Host ("::notice title=Rust tests::" + ($sum -replace "`r","" -replace "`n","%0A"))
          if ($LASTEXITCODE -ne 0) { throw "cargo test failed" }

      - name: Clippy (informational)
        working-directory: src-tauri
        shell: pwsh
        run: |
          $out = cargo clippy --workspace --all-targets 2>&1 | Out-String
          $lines = $out -split "`n" | ForEach-Object { $_.TrimEnd() }
          $n = ($lines | Where-Object { $_ -match '^(warning|error)' }).Count
          $det = (($lines | Select-String -Pattern '^(warning|error)' -Context 0,4 | Select-Object -First 40 | ForEach-Object { $_.Line + "`n" + ($_.Context.PostContext -join "`n") }) -join "`n")
          if ($det.Length -gt 3500) { $det = $det.Substring(0,3500) }
          Write-Host $out
          Write-Host ("::notice title=clippy workspace ($n warning/error lines)::" + ($det -replace "`r","" -replace "`n","%0A"))
        continue-on-error: true

      - name: Build app and NSIS installer
        run: npx tauri build

      - name: Smoke test - launch the real application
        shell: pwsh
        run: |
          $exe = "src-tauri/target/release/vlinux.exe"
          if (-not (Test-Path $exe)) { throw "vlinux.exe not built" }
          $p = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 15
          if ($p.HasExited) { throw "VLINUX exited early with code $($p.ExitCode)" }
          $ws = [math]::Round($p.WorkingSet64/1MB,1)
          Write-Host "VLINUX is running (PID $($p.Id)), working set $ws MiB"
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $b = [System.Windows.Forms.SystemInformation]::VirtualScreen
          $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
          $g = [System.Drawing.Graphics]::FromImage($bmp)
          $g.CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          $bmp.Save("artifacts/launch.png")
          # Measure idle CPU over 10s
          $c0 = (Get-Process -Id $p.Id).CPU; Start-Sleep -Seconds 10
          $c1 = (Get-Process -Id $p.Id).CPU
          $cpu = [math]::Round(($c1-$c0)/10*100,2)
          Write-Host "::notice title=Smoke launch::vlinux.exe still running after 15s (PID $($p.Id)); main-process working set $ws MiB; idle CPU $cpu % of one core over 10s (main process only, excludes WebView2 child processes)"
          $kids = Get-CimInstance Win32_Process | Where-Object { $_.Name -eq 'msedgewebview2.exe' } | Measure-Object
          Write-Host "WebView2 processes on runner: $($kids.Count)"
          $small = New-Object System.Drawing.Bitmap 960, 540
          $gg = [System.Drawing.Graphics]::FromImage($small); $gg.DrawImage($bmp, 0, 0, 960, 540)
          $small.Save("$PWD/artifacts/launch-small.png")
          "screen $($b.Width)x$($b.Height)" | Out-File artifacts/screen.txt
          Stop-Process -Id $p.Id -Force

      - name: Collect artifacts
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          Copy-Item src-tauri/Cargo.lock artifacts/ -ErrorAction SilentlyContinue
          Copy-Item src-tauri/target/release/bundle/nsis/*.exe artifacts/ -ErrorAction SilentlyContinue

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vlinux-windows
          path: artifacts/
