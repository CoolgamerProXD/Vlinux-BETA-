name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lock:
    name: Resolve and check Cargo.lock
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Needs to push the refreshed lock file back to the branch when dependencies changed.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      # Resolves any dependency added to a Cargo.toml and records it in Cargo.lock without
      # touching versions that are already pinned. The other jobs then run with --locked.
      - name: Resolve dependencies
        run: cargo metadata --manifest-path src-tauri/Cargo.toml --format-version 1 > /dev/null

      - uses: actions/upload-artifact@v4
        with:
          name: cargo-lock
          path: src-tauri/Cargo.lock

      # Formatting is applied, not merely checked: on pushes the formatted tree is committed back (the
      # follow-up run is then the verification run). Other events only report.
      - name: Format Rust code (rustfmt)
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all

      - name: Commit refreshed Cargo.lock and formatting (push events on non-main branches only)
        if: github.event_name == 'push' && github.ref != 'refs/heads/main'
        run: |
          if git diff --quiet; then
            echo "Cargo.lock and formatting already up to date"
          else
            git status --short | head -50
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A src-tauri
            git commit -m "chore: refresh Cargo.lock / rustfmt (applied by CI)"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

  runtime:
    name: Runtime crate tests (fast, no Tauri, no Windows)
    needs: lock
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: cargo-lock
          path: src-tauri

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Test vlinux-runtime (fake wsl.exe output, no distribution needed)
        working-directory: src-tauri
        shell: bash
        env:
          CARGO_TERM_COLOR: never # colour codes would hide error lines from the annotations below
        run: |
          set +e
          cargo test -p vlinux-runtime --locked 2>&1 | tee ../runtime-test.log
          code=${PIPESTATUS[0]}
          sum=$(grep -E '^test result|^error|^warning: unused|Running |Doc-tests' ../runtime-test.log | head -40 | sed ':a;N;$!ba;s/\n/%0A/g')
          if [ "$code" -ne 0 ]; then
            echo "::error title=runtime tests FAILED::${sum}"
            # Failure details as several small annotations, control characters removed (a raw
            # escape character in a test's output can make the runner drop a long annotation).
            grep -E -A7 '^error|^---- |panicked at|FAILED|failed:' ../runtime-test.log | head -90 | tr -cd '\11\12\40-\176' | cut -c1-300 > ../runtime-fail.txt || true
            split -l 9 ../runtime-fail.txt ../runtime-fail-part-
            n=0
            for f in ../runtime-fail-part-*; do
              n=$((n+1))
              [ "$n" -gt 9 ] && break
              echo "::error title=runtime tests FAILED (detail $n)::$(sed ':a;N;$!ba;s/\n/%0A/g' "$f")"
            done
            exit 1
          fi
          echo "::notice title=runtime tests::${sum}"

      - name: Clippy on the runtime crate (informational)
        working-directory: src-tauri
        shell: bash
        run: |
          cargo clippy -p vlinux-runtime --all-targets 2>&1 | tee ../clippy.log || true
          n=$(grep -c '^warning' ../clippy.log || true)
          det=$( (grep -E -A4 '^warning|^error' ../clippy.log || true) | head -60 | cut -c1-240 | sed ':a;N;$!ba;s/\n/%0A/g')
          echo "::notice title=clippy (runtime crate): ${n} warning lines::${det}"
        continue-on-error: true

  windows:
    name: Build, test and smoke-launch on Windows
    needs: lock
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: cargo-lock
          path: src-tauri

      - name: Host information (read-only)
        shell: pwsh
        run: |
          $os = (Get-CimInstance Win32_OperatingSystem)
          $wsl = (wsl.exe --status 2>&1 | Out-String) -replace "`0",""
          $msg = "OS: $($os.Caption) $($os.Version) build $($os.BuildNumber)`nrustc: $(rustc --version)`ncargo: $(cargo --version)`nnode: $(node --version)  npm: $(npm --version)`nwsl --status: $($wsl.Trim())"
          Write-Host $msg
          Write-Host ("::notice title=Host info::" + ($msg -replace "`r","" -replace "`n","%0A"))
        continue-on-error: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build

      - name: Rust unit tests
        working-directory: src-tauri
        shell: pwsh
        run: |
          $out = cargo test --workspace --locked 2>&1 | Out-String
          Write-Host $out
          $sum = ($out -split "`n" | Where-Object { $_ -match 'Running |test result|^error|FAILED|panicked' }) -join "`n"
          Write-Host ("::notice title=Rust tests::" + ($sum -replace "`r","" -replace "`n","%0A"))
          if ($LASTEXITCODE -ne 0) { throw "cargo test failed" }

      - name: Real wsl.exe under ConPTY, unregistered distribution (informational)
        working-directory: src-tauri
        shell: pwsh
        run: |
          $out = cargo test -p vlinux-runtime --test terminal_real_pty real_wsl -- --nocapture 2>&1 | Out-String
          Write-Host $out
          $line = ($out -split "`n" | Where-Object { $_ -match 'real wsl.exe|wsl.exe could not be started|test result' }) -join "`n"
          Write-Host ("::notice title=Real wsl.exe under ConPTY::" + ($line -replace "`r","" -replace "`n","%0A"))
        continue-on-error: true

      - name: Clippy (informational)
        working-directory: src-tauri
        shell: pwsh
        run: |
          $out = cargo clippy --workspace --all-targets 2>&1 | Out-String
          $lines = $out -split "`n" | ForEach-Object { $_.TrimEnd() }
          $n = ($lines | Where-Object { $_ -match '^(warning|error)' }).Count
          $det = (($lines | Select-String -Pattern '^(warning|error)' -Context 0,4 | Select-Object -First 40 | ForEach-Object { $_.Line + "`n" + ($_.Context.PostContext -join "`n") }) -join "`n")
          if ($det.Length -gt 3500) { $det = $det.Substring(0,3500) }
          Write-Host $out
          Write-Host ("::notice title=clippy workspace ($n warning/error lines)::" + ($det -replace "`r","" -replace "`n","%0A"))
        continue-on-error: true

      - name: Build app and NSIS installer
        run: npx tauri build

      - name: Smoke test - launch the real application
        shell: pwsh
        run: |
          $exe = "src-tauri/target/release/vlinux.exe"
          if (-not (Test-Path $exe)) { throw "vlinux.exe not built" }
          $p = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 15
          if ($p.HasExited) { throw "VLINUX exited early with code $($p.ExitCode)" }
          $ws = [math]::Round($p.WorkingSet64/1MB,1)
          Write-Host "VLINUX is running (PID $($p.Id)), working set $ws MiB"
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $b = [System.Windows.Forms.SystemInformation]::VirtualScreen
          $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
          $g = [System.Drawing.Graphics]::FromImage($bmp)
          $g.CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          $bmp.Save("artifacts/launch.png")
          # Measure idle CPU over 10s
          $c0 = (Get-Process -Id $p.Id).CPU; Start-Sleep -Seconds 10
          $c1 = (Get-Process -Id $p.Id).CPU
          $cpu = [math]::Round(($c1-$c0)/10*100,2)
          Write-Host "::notice title=Smoke launch::vlinux.exe still running after 15s (PID $($p.Id)); main-process working set $ws MiB; idle CPU $cpu % of one core over 10s (main process only, excludes WebView2 child processes)"
          $kids = Get-CimInstance Win32_Process | Where-Object { $_.Name -eq 'msedgewebview2.exe' } | Measure-Object
          Write-Host "WebView2 processes on runner: $($kids.Count)"
          $small = New-Object System.Drawing.Bitmap 960, 540
          $gg = [System.Drawing.Graphics]::FromImage($small); $gg.DrawImage($bmp, 0, 0, 960, 540)
          $small.Save("$PWD/artifacts/launch-small.png")
          "screen $($b.Width)x$($b.Height)" | Out-File artifacts/screen.txt
          Stop-Process -Id $p.Id -Force

      # Same build as production except that the window config adds --remote-debugging-port, so the
      # smoke test can drive the real WebView2. The installer above is NOT built from this.
      - name: Build a CDP-enabled copy of the app (for the WebView2 smoke only)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $cfg = Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json
          $w = $cfg.app.windows[0]
          $w | Add-Member -NotePropertyName additionalBrowserArgs -NotePropertyValue '--disable-features=msWebOOUI,msPdfOOUI,msSmartScreenProtection --remote-debugging-port=9222' -Force
          ConvertTo-Json -InputObject $cfg -Depth 30 | Set-Content (Join-Path $env:RUNNER_TEMP 'cdp.conf.json') -Encoding utf8
          npx tauri build --no-bundle --config (Join-Path $env:RUNNER_TEMP 'cdp.conf.json')
          Copy-Item src-tauri/target/release/vlinux.exe (Join-Path $env:RUNNER_TEMP 'vlinux-cdp.exe')

      # Installs the real NSIS installer silently for the CURRENT USER (no admin), checks what it put
      # on disk, launches the INSTALLED app with WebView2 remote debugging on, drives it with
      # scripts/webview-smoke.mjs, measures it (main process and WebView2 children separately),
      # then uninstalls and checks the removal. This runs on a GitHub runner - it is not the user's PC.
      - name: Installer end-to-end (install, shortcuts, launch, real WebView2, measure, uninstall)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          $report = New-Object System.Collections.Generic.List[string]
          function Note($m) { Write-Host $m; $report.Add($m) }

          $setup = Get-ChildItem src-tauri/target/release/bundle/nsis -Filter *.exe | Select-Object -First 1
          if (-not $setup) { throw "NSIS installer not found" }
          $hash = (Get-FileHash $setup.FullName -Algorithm SHA256).Hash
          Note "Installer: $($setup.Name) ($([math]::Round($setup.Length/1MB,1)) MiB) sha256=$hash"

          # ---- install (silent, per-user) ----
          $sw = [Diagnostics.Stopwatch]::StartNew()
          $inst = Start-Process -FilePath $setup.FullName -ArgumentList '/S' -Wait -PassThru
          Note "Silent install exit code $($inst.ExitCode) in $($sw.ElapsedMilliseconds) ms"
          if ($inst.ExitCode -ne 0) { throw "installer failed" }
          $exeItem = Get-ChildItem $env:LOCALAPPDATA -Recurse -Depth 3 -Filter 'vlinux.exe' -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $exeItem) { throw "installed vlinux.exe not found under LOCALAPPDATA" }
          $exe = $exeItem.FullName
          $dir = $exeItem.DirectoryName
          Note "Installed to: $dir"
          Get-ChildItem $dir | ForEach-Object { Note "  installed: $($_.Name) ($([math]::Round($_.Length/1KB)) KiB)" }
          $uninst = Join-Path $dir 'uninstall.exe'
          if (-not (Test-Path $uninst)) { throw "uninstall.exe missing" }

          # ---- shortcuts ----
          $wsh = New-Object -ComObject WScript.Shell
          $roots = @{
            'Start Menu (user)'   = "$env:APPDATA\Microsoft\Windows\Start Menu\Programs"
            'Start Menu (all)'    = "$env:ProgramData\Microsoft\Windows\Start Menu\Programs"
            'Desktop (user)'      = [Environment]::GetFolderPath('Desktop')
            'Desktop (all)'       = [Environment]::GetFolderPath('CommonDesktopDirectory')
          }
          $found = @{}
          foreach ($k in $roots.Keys) {
            if (-not (Test-Path $roots[$k])) { continue }
            Get-ChildItem $roots[$k] -Recurse -Filter *.lnk -ErrorAction SilentlyContinue | Where-Object { $_.Name -match 'vlinux' } | ForEach-Object {
              $t = $wsh.CreateShortcut($_.FullName).TargetPath
              $found[$k] = $_.FullName
              Note "Shortcut [$k] $($_.Name) -> $t"
            }
          }
          $hasStart = $found.Keys | Where-Object { $_ -like 'Start Menu*' }
          $hasDesk = $found.Keys | Where-Object { $_ -like 'Desktop*' }
          if (-not $hasStart) { throw "no Start Menu shortcut was created" }
          if ($hasDesk) { Note "Desktop shortcut: created by the silent installer" }
          else { Write-Host "::warning title=Desktop shortcut::the silent (/S) install created a Start Menu entry but no Desktop shortcut"; Note "Desktop shortcut: NOT created by the silent installer" }

          $lnkSummary = ($found.Keys | Sort-Object | ForEach-Object { "$_ = $(Split-Path $found[$_] -Leaf)" }) -join '; '
          Write-Host "::notice title=Installer result (silent /S install, runner)::installed to $dir; files: $((Get-ChildItem $dir | ForEach-Object { $_.Name }) -join ', '); shortcuts: $lnkSummary"
          # ---- launch the installed app ----
          function Get-Tree([int]$rootPid) {
            $all = Get-CimInstance Win32_Process
            $ids = New-Object 'System.Collections.Generic.HashSet[int]'
            [void]$ids.Add($rootPid)
            $grew = $true
            while ($grew) {
              $grew = $false
              foreach ($q in $all) {
                if ($ids.Contains([int]$q.ParentProcessId) -and -not $ids.Contains([int]$q.ProcessId)) { [void]$ids.Add([int]$q.ProcessId); $grew = $true }
              }
            }
            $all | Where-Object { $ids.Contains([int]$_.ProcessId) }
          }
          function Measure-Tree([int]$rootPid, [string]$label) {
            $t = @(Get-Tree $rootPid)
            $main = $t | Where-Object { $_.ProcessId -eq $rootPid }
            $wv = @($t | Where-Object { $_.ProcessId -ne $rootPid -and $_.Name -eq 'msedgewebview2.exe' })
            $other = @($t | Where-Object { $_.ProcessId -ne $rootPid -and $_.Name -ne 'msedgewebview2.exe' })
            $mw = [math]::Round($main.WorkingSetSize/1MB,1); $mp = [math]::Round($main.PrivatePageCount/1MB,1)
            $ww = [math]::Round((($wv | Measure-Object WorkingSetSize -Sum).Sum)/1MB,1); $wp = [math]::Round((($wv | Measure-Object PrivatePageCount -Sum).Sum)/1MB,1)
            $line = "[$label] main process: working set $mw MiB, private $mp MiB | WebView2 children: $($wv.Count) processes, working set sum $ww MiB (shared pages counted once per process), private sum $wp MiB | other descendants: $($other.Count)"
            if ($other.Count -gt 0) { $line += ' [' + ((($other | Group-Object Name | Sort-Object Count -Descending | Select-Object -First 6 | ForEach-Object { "$($_.Name) x$($_.Count)" }) -join ', ')) + ']' }
            Note $line
            Write-Host "::notice title=Memory $label::$line"
            return ,($t | ForEach-Object { [int]$_.ProcessId })
          }
          function Cpu-Seconds($ids) {
            $sum = 0.0
            foreach ($i in $ids) { $pp = Get-Process -Id $i -ErrorAction SilentlyContinue; if ($pp) { $sum += $pp.TotalProcessorTime.TotalSeconds } }
            return $sum
          }

          # A WebView2 browser process left over from the earlier smoke launch would be reused (and would
          # ignore the debugging switch), so stop strays and give this launch its own, fresh profile.
          Get-Process msedgewebview2 -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          Start-Sleep -Seconds 2
          $env:WEBVIEW2_USER_DATA_FOLDER = Join-Path $env:RUNNER_TEMP 'vlinux-webview2-profile'
          Remove-Item -Recurse -Force $env:WEBVIEW2_USER_DATA_FOLDER -ErrorAction SilentlyContinue
          $sw = [Diagnostics.Stopwatch]::StartNew()
          $p = Start-Process -FilePath $exe -PassThru
          while (-not $p.HasExited -and $sw.Elapsed.TotalSeconds -lt 60) { $p.Refresh(); if ($p.MainWindowHandle -ne 0) { break }; Start-Sleep -Milliseconds 25 }
          $startMs = $sw.ElapsedMilliseconds
          if ($p.HasExited) { throw "installed VLINUX exited early with code $($p.ExitCode)" }
          Note "Startup: process start to the main window being shown = $startMs ms (window handle $($p.MainWindowHandle)); the desktop inside it appears later - see Launch to desktop"
          Write-Host "::notice title=Window shown (runner)::$startMs ms from process start to the main window being shown (an empty dark window; the desktop is drawn after the web content loads). Installed app on a GitHub runner, not the user's PC"

          Start-Sleep -Seconds 10
          $ids = Measure-Tree $p.Id 'idle, after launch'
          $c0 = Cpu-Seconds $ids; Start-Sleep -Seconds 10; $c1 = Cpu-Seconds $ids
          $cpu = [math]::Round(($c1-$c0)/10*100,2)
          Note "Idle CPU over 10 s (main + all descendants): $cpu % of one core"
          Write-Host "::notice title=Idle CPU (runner)::$cpu % of one core over 10 s, main process plus WebView2 children"

          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $b = [System.Windows.Forms.SystemInformation]::VirtualScreen
          $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
          $g = [System.Drawing.Graphics]::FromImage($bmp)
          $g.CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
          $bmp.Save("$PWD/artifacts/installed-launch.png")

          # The production exe is done (installed app: window, memory, CPU measured above). WebView2 did not
          # honour WEBVIEW2_ADDITIONAL_BROWSER_ARGUMENTS for this host, so the real-WebView2 smoke runs a copy of
          # the same build whose window config adds only --remote-debugging-port (built by the previous step).
          Stop-Process -Id $p.Id -Force
          Start-Sleep -Seconds 5
          Get-Process msedgewebview2 -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          Start-Sleep -Seconds 2
          Remove-Item -Recurse -Force $env:WEBVIEW2_USER_DATA_FOLDER -ErrorAction SilentlyContinue
          $cdpExe = Join-Path $env:RUNNER_TEMP 'vlinux-cdp.exe'
          if (-not (Test-Path $cdpExe)) { throw "CDP-enabled build missing" }
          $p = Start-Process -FilePath $cdpExe -PassThru

          # ---- drive the real WebView2 window ----
          $env:OUT_DIR = 'artifacts'
          $env:PROC_START_MS = [string][DateTimeOffset]::new($p.StartTime).ToUnixTimeMilliseconds()
          node scripts/webview-smoke.mjs 2>&1 | Tee-Object -FilePath artifacts/webview-smoke.log
          $smoke = $LASTEXITCODE
          if ($smoke -ne 0) {
            $ports = (Get-NetTCPConnection -State Listen -ErrorAction SilentlyContinue | Where-Object { (Get-Tree $p.Id | ForEach-Object { [int]$_.ProcessId }) -contains $_.OwningProcess } | ForEach-Object { "$($_.LocalAddress):$($_.LocalPort)" }) -join ', '
            $cl = (Get-CimInstance Win32_Process -Filter "Name='msedgewebview2.exe'" | Select-Object -First 1).CommandLine
            if ($cl -and $cl.Length -gt 700) { $cl = $cl.Substring(0,700) }
            Write-Host ("::notice title=CDP diagnosis::listening ports of the app tree: [" + $ports + "]; first WebView2 command line: " + ($cl -replace "%","%25" -replace "`n"," "))
          }
          $logText = (Get-Content artifacts/webview-smoke.log -Raw)
          if ($logText.Length -gt 3500) { $logText = $logText.Substring(0, 3500) }
          Write-Host ("::notice title=WebView2 smoke log::" + ($logText -replace "`r","" -replace "%","%25" -replace "`n","%0A"))
          Note "WebView2 smoke exit code: $smoke"
          $ids2 = Measure-Tree $p.Id 'after the smoke test opened the apps'
          $allIds = @($ids + $ids2 | Select-Object -Unique)
          Start-Sleep -Seconds 8
          $null = Measure-Tree $p.Id 'settled, 8 s after the smoke test'

          # ---- desktop integration in the REAL window: real OS keystrokes, full screen, resize,
          # return to Windows. Not fatal in this milestone: the result is reported either way. ----
          node scripts/desktop-smoke.mjs 2>&1 | Tee-Object -FilePath artifacts/desktop-smoke.log
          $desk = $LASTEXITCODE
          $dtext = (Get-Content artifacts/desktop-smoke.log -Raw)
          if ($dtext.Length -gt 9000) { $dtext = $dtext.Substring(0, 9000) }
          $global:LASTEXITCODE = 0
          # (a warning, not a notice: this step already uses up GitHub's notice-annotation allowance)
          Write-Host ("::warning title=Desktop smoke log (exit $desk)::" + ($dtext -replace "`r","" -replace "%","%25" -replace "`n","%0A"))
          Note "Desktop smoke exit code: $desk"

          # ---- exit and clean up ----
          Stop-Process -Id $p.Id -Force
          Start-Sleep -Seconds 6
          $left = @($allIds | Where-Object { $_ -ne $p.Id -and (Get-Process -Id $_ -ErrorAction SilentlyContinue) })
          Note "After exit: $($left.Count) of the app's former child processes still running"

          # ---- uninstall (silent); must remove the program but not user data ----
          $appData = Join-Path $env:APPDATA 'app.vlinux.desktop'
          $dataBefore = Test-Path $appData
          Start-Process -FilePath $uninst -ArgumentList '/S' -Wait | Out-Null
          $t0 = Get-Date
          while ((Test-Path $exe) -and ((Get-Date) - $t0).TotalSeconds -lt 60) { Start-Sleep -Milliseconds 500 }
          Note "Uninstall: vlinux.exe removed = $(-not (Test-Path $exe))"
          $remaining = @(Get-ChildItem $env:LOCALAPPDATA -Recurse -Depth 3 -Filter 'vlinux.exe' -ErrorAction SilentlyContinue)
          $lnkLeft = @($found.Values | Where-Object { Test-Path $_ })
          Note "Uninstall: shortcuts left = $($lnkLeft.Count); installed exe copies left = $($remaining.Count); user data folder existed before=$dataBefore after=$(Test-Path $appData)"
          $report | Out-File artifacts/installer-e2e.txt
          Write-Host "::notice title=Installer end-to-end::installed, launched, smoke-tested and uninstalled on a runner; smoke exit $smoke; leftovers after uninstall: exe $($remaining.Count), shortcuts $($lnkLeft.Count); child processes still running 6 s after exit: $($left.Count); user-data folder present before uninstall=$dataBefore, after=$(Test-Path $appData); install folder left=$(Test-Path $dir)"
          if ($smoke -ne 0) { throw "WebView2 smoke test failed (see webview-smoke.log)" }
          if ($remaining.Count -gt 0) { throw "uninstall left vlinux.exe behind" }

      - name: Collect artifacts
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          Copy-Item src-tauri/Cargo.lock artifacts/ -ErrorAction SilentlyContinue
          Copy-Item src-tauri/target/release/bundle/nsis/*.exe artifacts/ -ErrorAction SilentlyContinue

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vlinux-windows
          path: artifacts/

  # Publishes the installer built by the Windows job as a GitHub PRE-RELEASE so it can be downloaded
  # with one click (workflow artifacts need the Actions tab and expire). Branch pushes only, never main.
  release:
    name: Publish installer as a pre-release
    needs: windows
    if: github.event_name == 'push' && github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: vlinux-windows
          path: dist-artifacts

      - name: Create or replace the pre-release for this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          TAG="installer-${GITHUB_SHA::7}"
          ls -la dist-artifacts
          SETUP=$(ls dist-artifacts/*-setup.exe | head -n 1)
          SUM=$(sha256sum "$SETUP" | cut -d' ' -f1)
          gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag || true
          gh release create "$TAG" "$SETUP" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease \
            --title "VLINUX installer (commit ${GITHUB_SHA::7})" \
            --notes "Unsigned Windows installer (NSIS, per-user, no admin) built by CI from commit ${GITHUB_SHA}. SHA-256: ${SUM}. Windows SmartScreen will warn because the installer is not code-signed. Uninstalling removes the program only; it never touches WSL distributions or your files."
