name: WSL lab

# A disposable GitHub-hosted Windows VM used to look at how the REAL wsl.exe / ConPTY / file share
# behave. It runs only when this file or scripts/wsl-lab change. Nothing here touches a user's PC.
on:
  push:
    branches: ['**']
    paths:
      - '.github/workflows/wsl-lab.yml'
      - 'scripts/wsl-lab/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    name: WSL lab - what does this runner have?
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Probe
        shell: pwsh
        run: ./scripts/wsl-lab/probe.ps1
        continue-on-error: true

  arch:
    name: WSL lab - real Arch (WSL 3.0.3.0) on a disposable runner
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Install and configure archlinux (disposable VM)
        shell: pwsh
        run: ./scripts/wsl-lab/arch-setup.ps1
        continue-on-error: true
      - name: Symlink experiment on the real share
        shell: pwsh
        run: ./scripts/wsl-lab/symlink-experiment.ps1
        continue-on-error: true
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Real VLINUX diagnostics against the real Arch (same code path as the app)
        shell: pwsh
        run: ./scripts/wsl-lab/real-diag.ps1
        continue-on-error: true
